services:
  - type: web
    name: flightprice-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://flightprice-sghf.onrender.com
      - key: GROQ_API_KEY
        sync: false
