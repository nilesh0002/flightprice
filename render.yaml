services:
  - type: web
    name: flightprice-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_TOKEN
        sync: false
